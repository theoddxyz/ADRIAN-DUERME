          const ctx = window.audioCtx || (window.audioCtx = new(window.AudioContext||window.webkitAudioContext)());

          const g = ctx.createGain();
          o.type = 'sine';

    // Cadena compuesta de eslabones con constraints
    function createChain(n) {
      // Limpia cadena previa si existe
      if (chain.links.length) {
        if (chain.clawConstraint) { World.remove(world, chain.clawConstraint); chain.clawConstraint = null; }
        if (chain.carriageConstraint) { World.remove(world, chain.carriageConstraint); chain.carriageConstraint = null; }
        for (const c of chain.constraints) World.remove(world, c);
        for (const l of chain.links) World.remove(world, l);
        chain = { links: [], constraints: [], carriageConstraint: null, clawConstraint: null };
      }

      const x = carriage.position.x;
  // Limitar el descenso inicial de la cadena para que el carro esté aún más pegado al riel
  const startY = RAIL_Y + 2; // antes 12, ahora mucho más cerca del riel
      for (let i = 0; i < n; i++) {
        const link = Bodies.circle(x, startY + i * (LINK_R*2 + LINK_SPACING), LINK_R, {
          chamfer: 2,
          frictionAir: 0.02,
          friction: 0.2,
          density: 0.0015,
          collisionFilter: { group: chainGroup },
          label: 'eslabon-' + (i+1),
          render: { fillStyle: '#fff' }
        });
        chain.links.push(link);
      }
      World.add(world, chain.links);

      // Conectar eslabones contiguos
      for (let i = 1; i < chain.links.length; i++) {
        const prev = chain.links[i - 1], curr = chain.links[i];
        const con = Constraint.create({
          bodyA: prev,
          bodyB: curr,
          length: (LINK_R*2 + LINK_SPACING),
          stiffness: 0.9,
          damping: 0.08,
          render: { visible: false } // constraints invisibles
        });
        chain.constraints.push(con);
      }

      // Unir al carro (parte superior)
      chain.carriageConstraint = Constraint.create({
        bodyA: carriage,
        pointA: { x: 0, y: 9 },
        bodyB: chain.links[0],
        pointB: { x: 0, y: 0 },
        length: (LINK_R + 2),
        stiffness: 0.9,
        damping: 0.2,
        render: { visible: false }
      });

      World.add(world, chain.constraints.concat(chain.carriageConstraint));

      // Posicionar garra al final y conectar
      const last = chain.links[chain.links.length - 1];
      Body.setPosition(claw, { x: last.position.x, y: last.position.y + LINK_R + CLAW_RADIUS + 2 });
      chain.clawConstraint = Constraint.create({
        bodyA: last,
        pointA: { x: 0, y: 0 },
        bodyB: claw,
        length: (LINK_R + CLAW_RADIUS + 2),
        stiffness: 0.9,
        damping: 0.2,
        render: { visible: false }
      });
      World.add(world, chain.clawConstraint);
    }

      const cx = claw.position.x, cy = claw.position.y;
      const pivotYOffset = -FINGER_LEN/2 + 6;
      const yF = cy + CLAW_RADIUS * 0.7;
      const toeYOffset = FINGER_LEN/2 - Math.max(6, FINGER_TOE_THICK/2 + 2);
      // Ángulos iniciales
      leftTarget = armsClosed ? Math.PI/4 : Math.PI/10;
      rightTarget = armsClosed ? -Math.PI/4 : -Math.PI/10;

      // Dedo izquierdo
      leftFinger = Body.create({
        parts: [
          Bodies.rectangle(cx - CLAW_RADIUS * 0.9, yF, FINGER_W, FINGER_LEN, {
            chamfer: 3, friction: 2.0, frictionStatic: 2.0, restitution: 0.02,
            density: 0.006,
            collisionFilter: { group: chainGroup }, label: 'dedo-izquierdo', render: { fillStyle: '#fff' }
          }),
          Bodies.rectangle(
            cx - CLAW_RADIUS * 0.9 + (FINGER_W/2) + (FINGER_TOE_LEN/2),
            yF + toeYOffset,
            FINGER_TOE_LEN, FINGER_TOE_THICK,
            { chamfer: 2, friction: 2.0, frictionStatic: 2.0, density: 0.018, collisionFilter: { group: chainGroup }, label: 'dedo-izquierdo-extremo', render: { fillStyle: '#fff' } }
          )
        ],
        collisionFilter: { group: chainGroup },
        label: 'dedo-izquierdo-compuesto'
      });
      Body.setAngle(leftFinger, leftTarget);

      // Dedo derecho
      rightFinger = Body.create({
        parts: [
          Bodies.rectangle(cx + CLAW_RADIUS * 0.9, yF, FINGER_W, FINGER_LEN, {
            chamfer: 3, friction: 2.0, frictionStatic: 2.0, restitution: 0.02,
            density: 0.006,
            collisionFilter: { group: chainGroup }, label: 'dedo-derecho', render: { fillStyle: '#fff' }
          }),
          Bodies.rectangle(
            cx + CLAW_RADIUS * 0.9 - (FINGER_W/2) - (FINGER_TOE_LEN/2),
            yF + toeYOffset,
            FINGER_TOE_LEN, FINGER_TOE_THICK,
            { chamfer: 2, friction: 2.0, frictionStatic: 2.0, density: 0.018, collisionFilter: { group: chainGroup }, label: 'dedo-derecho-extremo', render: { fillStyle: '#fff' } }
          )
        ],
        collisionFilter: { group: chainGroup },
        label: 'dedo-derecho-compuesto'
      });
      Body.setAngle(rightFinger, rightTarget);

      World.add(world, [leftFinger, rightFinger]);
      leftFinger.frictionAir = 0.12;
      rightFinger.frictionAir = 0.12;

      // Pivotes (revolute)
      fingerPivotL = Constraint.create({
        bodyA: claw,
        pointA: { x: -CLAW_RADIUS * 0.7, y: CLAW_RADIUS * 0.25 },
        bodyB: leftFinger,
        pointB: { x: 0, y: pivotYOffset },
        length: 0,
        stiffness: 1,
        render: { strokeStyle: '#7ea6ff', lineWidth: 2 }
      });
      fingerPivotR = Constraint.create({
        bodyA: claw,
        pointA: { x:  CLAW_RADIUS * 0.7, y: CLAW_RADIUS * 0.25 },
        bodyB: rightFinger,
        pointB: { x: 0, y: pivotYOffset },
        length: 0,
        stiffness: 1,
        render: { strokeStyle: '#7ea6ff', lineWidth: 2 }
      });
      World.add(world, [fingerPivotL, fingerPivotR]);
    }

    function addLink() {
      if (chain.links.length >= CHAIN_MAX_LINKS) return;
      const last = chain.links[chain.links.length - 1];
      const pos = { x: last.position.x, y: last.position.y + (LINK_R*2 + LINK_SPACING) };
      const link = Bodies.circle(pos.x, pos.y, LINK_R, {
        chamfer: 2,
        frictionAir: 0.02,
        friction: 0.2,
        density: 0.0015,
        collisionFilter: { group: chainGroup },
        label: 'eslabon-' + (chain.links.length + 1),
        render: { fillStyle: '#fff' } // cadena blanca
      });
      World.add(world, link);
      chain.links.push(link);

      if (chain.clawConstraint) { World.remove(world, chain.clawConstraint); chain.clawConstraint = null; }

      const con = Constraint.create({
        bodyA: last,
        bodyB: link,
        length: (LINK_R*2 + LINK_SPACING),
        stiffness: 0.9,
          damping: 0.08,
        render: { visible: false } // constraints invisibles
      });
      chain.constraints.push(con);
      World.add(world, con);

      chain.clawConstraint = Constraint.create({
        bodyA: link,
        pointA: { x: 0, y: 0 },
        bodyB: claw,
        length: (LINK_R + CLAW_RADIUS + 2),
        stiffness: 0.9,
          damping: 0.08,
        render: { visible: false }
      });
      World.add(world, chain.clawConstraint);
    }

    function removeLink() {
      if (chain.links.length <= CHAIN_MIN_LINKS) return;
      const last = chain.links.pop();
      if (chain.clawConstraint) { World.remove(world, chain.clawConstraint); chain.clawConstraint = null; }
      const con = chain.constraints.pop();
      if (con) World.remove(world, con);
      const newLast = chain.links[chain.links.length - 1];
      chain.clawConstraint = Constraint.create({
        bodyA: newLast,
        pointA: { x: 0, y: 0 },
        bodyB: claw,
        length: (LINK_R + CLAW_RADIUS + 2),
        stiffness: 0.9,
          damping: 0.08,
        render: { visible: false }
      });
      World.add(world, chain.clawConstraint);
      World.remove(world, last);
    }

    function spawnPlushes() {
      // No crear peluches al iniciar
      plushes = [];
      updateHud();
    }

    // --- RAGDOLL UTILIDAD ---
function createMiniRagdoll(x, y, scale = 0.45) {
  // Paleta de colores fuertes y raros
  const palette = [
    '#ff0055', '#00ffd0', '#fffb00', '#ff00ff', '#00ff2a', '#ff7f00', '#00aaff', '#a020f0', '#ff2222', '#00ff99', '#ff8800', '#00fffa', '#ff00a2', '#aaff00', '#ff0099', '#00ff44', '#ff6600', '#00bfff', '#ff00c8', '#00ffb2'
  ];
  const baseColor = palette[Math.floor(Math.random()*palette.length)];
  function rc() { return baseColor; }
  // Basado en Example.ragdoll.ragdoll adaptado a Matter.js global
  const Body = Matter.Body, Bodies = Matter.Bodies, Constraint = Matter.Constraint, Composite = Matter.Composite;
  const head = Bodies.rectangle(x, y - 60*scale, 34*scale, 40*scale, { chamfer: { radius: 15*scale }, render: { fillStyle: rc() }, density: 0.001 });
  head.plugin = { isPlush: true };
  const chest = Bodies.rectangle(x, y, 55*scale, 80*scale, { chamfer: { radius: 20*scale }, render: { fillStyle: rc() }, density: 0.001 });
  chest.plugin = { isPlush: true };
  const rightUpperArm = Bodies.rectangle(x + 39*scale, y - 15*scale, 20*scale, 40*scale, { chamfer: { radius: 10*scale }, render: { fillStyle: rc() }, density: 0.001 });
  rightUpperArm.plugin = { isPlush: true };
  const rightLowerArm = Bodies.rectangle(x + 39*scale, y + 25*scale, 20*scale, 60*scale, { chamfer: { radius: 10*scale }, render: { fillStyle: rc() }, density: 0.001 });
  rightLowerArm.plugin = { isPlush: true };
  const leftUpperArm = Bodies.rectangle(x - 39*scale, y - 15*scale, 20*scale, 40*scale, { chamfer: { radius: 10*scale }, render: { fillStyle: rc() }, density: 0.001 });
  leftUpperArm.plugin = { isPlush: true };
  const leftLowerArm = Bodies.rectangle(x - 39*scale, y + 25*scale, 20*scale, 60*scale, { chamfer: { radius: 10*scale }, render: { fillStyle: rc() }, density: 0.001 });
  leftLowerArm.plugin = { isPlush: true };
  const leftUpperLeg = Bodies.rectangle(x - 20*scale, y + 57*scale, 20*scale, 40*scale, { chamfer: { radius: 10*scale }, render: { fillStyle: rc() }, density: 0.001 });
  leftUpperLeg.plugin = { isPlush: true };
  const leftLowerLeg = Bodies.rectangle(x - 20*scale, y + 97*scale, 20*scale, 60*scale, { chamfer: { radius: 10*scale }, render: { fillStyle: rc() }, density: 0.001 });
  leftLowerLeg.plugin = { isPlush: true };
  const rightUpperLeg = Bodies.rectangle(x + 20*scale, y + 57*scale, 20*scale, 40*scale, { chamfer: { radius: 10*scale }, render: { fillStyle: rc() }, density: 0.001 });
  rightUpperLeg.plugin = { isPlush: true };
  const rightLowerLeg = Bodies.rectangle(x + 20*scale, y + 97*scale, 20*scale, 60*scale, { chamfer: { radius: 10*scale }, render: { fillStyle: rc() }, density: 0.001 });
  rightLowerLeg.plugin = { isPlush: true };
  // Constraints invisibles
  const constraints = [
    Constraint.create({ bodyA: chest, pointA: {x:24*scale,y:-23*scale}, bodyB: rightUpperArm, pointB: {x:0,y:-8*scale}, stiffness:0.95, render: { visible: false } }),
    Constraint.create({ bodyA: chest, pointA: {x:-24*scale,y:-23*scale}, bodyB: leftUpperArm, pointB: {x:0,y:-8*scale}, stiffness:0.95, render: { visible: false } }),
    Constraint.create({ bodyA: chest, pointA: {x:-10*scale,y:30*scale}, bodyB: leftUpperLeg, pointB: {x:0,y:-10*scale}, stiffness:0.95, render: { visible: false } }),
    Constraint.create({ bodyA: chest, pointA: {x:10*scale,y:30*scale}, bodyB: rightUpperLeg, pointB: {x:0,y:-10*scale}, stiffness:0.95, render: { visible: false } }),
    Constraint.create({ bodyA: rightUpperArm, pointA: {x:0,y:15*scale}, bodyB: rightLowerArm, pointB: {x:0,y:-25*scale}, stiffness:0.95, render: { visible: false } }),
    Constraint.create({ bodyA: leftUpperArm, pointA: {x:0,y:15*scale}, bodyB: leftLowerArm, pointB: {x:0,y:-25*scale}, stiffness:0.95, render: { visible: false } }),
    Constraint.create({ bodyA: leftUpperLeg, pointA: {x:0,y:20*scale}, bodyB: leftLowerLeg, pointB: {x:0,y:-20*scale}, stiffness:0.95, render: { visible: false } }),
    Constraint.create({ bodyA: rightUpperLeg, pointA: {x:0,y:20*scale}, bodyB: rightLowerLeg, pointB: {x:0,y:-20*scale}, stiffness:0.95, render: { visible: false } }),
    Constraint.create({ bodyA: head, pointA: {x:0,y:25*scale}, bodyB: chest, pointB: {x:0,y:-35*scale}, stiffness:0.95, render: { visible: false } })
  ];
  const ragdoll = Composite.create({
    bodies: [chest, head, leftLowerArm, leftUpperArm, rightLowerArm, rightUpperArm, leftLowerLeg, rightLowerLeg, leftUpperLeg, rightUpperLeg],
    constraints: constraints
  });
  return ragdoll;
}


    function randomPlushie(x, y) {
      // Solo ragdoll
      return createMiniRagdoll(x, y, 0.45);
    }

    function randomColor() {
      const palette = ['#f7c59f','#fbeee6','#b5ead7','#ffb7b2','#b2cefe','#f7a072','#f6eac2','#e2f0cb','#b5ead7','#f7d6e0'];
      return palette[Math.floor(Math.random()*palette.length)];
    }

    function addMouse() {
      const mouse = Mouse.create(render.canvas);
      const mouseConstraint = MouseConstraint.create(engine, {
        mouse,
        constraint: { stiffness: 0.02, render: { visible: false } }
      });
      World.add(world, mouseConstraint);
      render.mouse = mouse;
    }

    function addWheel() {
      const canvas = render.canvas;
      canvas.addEventListener('wheel', onWheel, { passive: false });
    }

    function onWheel(e) {
      e.preventDefault();
      const STEP = 80; // píxeles de delta por eslabón
      wheelAcc += e.deltaY;
      while (wheelAcc >= STEP) { addLink(); wheelAcc -= STEP; }
      while (wheelAcc <= -STEP) { removeLink(); wheelAcc += STEP; }
    }

    function addHud() {
      document.getElementById('score').textContent = String(score);
      document.getElementById('left').textContent  = String(plushes.filter(p => p && p.plugin && p.plugin.isPlush).length);
    }

    function updateHud() {
      document.getElementById('score').textContent = String(score);
      document.getElementById('left').textContent  = String(plushes.filter(p => p && p.plugin && p.plugin.isPlush).length);
    }

    // Joystick 3D
    window.joystickState = { x: 0, y: 0 };
    window.onJoystick3DMove = function(dx, dy) {
      window.joystickState.x = Math.max(-1, Math.min(1, dx));
      window.joystickState.y = Math.max(-1, Math.min(1, dy));
    };
    window.addEventListener('DOMContentLoaded', function() {
      // Simple fallback for createJoystick3D
      if (typeof createJoystick3D === 'undefined') {
        window.createJoystick3D = function(containerId) {
          console.log('Joystick3D fallback loaded');
          // Hide the joystick container since we're using button controls
          const container = document.getElementById(containerId);
          if (container) container.style.display = 'none';
        };
      }
      createJoystick3D('joystick3d-container');
    });

// En drawOverlay, dibujar solo overlay y nombres
function drawOverlay() {
  const ctx = render.context;
  ctx.save();
  ctx.fillStyle = '#9fb7ff';
  ctx.font = '12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial';
  ctx.textAlign = 'center';
  ctx.fillText('RIEL', W/2, RAIL_Y - 24);
  ctx.strokeStyle = 'rgba(255,255,255,.18)';
  ctx.beginPath();
  ctx.arc(claw.position.x, claw.position.y, GRAB_RADIUS, 0, Math.PI*2);
  ctx.stroke();
}

    function tick() {
      // Mantener carro a la altura del riel
      Body.setPosition(carriage, { x: clamp(carriage.position.x, 150, W - 70), y: RAIL_Y });
      Body.setVelocity(carriage, { x: clamp(carriage.velocity.x, -6, 6), y: 0 });

      // Entrada: movimiento horizontal
      let moving = false;
      if (keys.left && !keys.right) {
        Body.setVelocity(carriage, { x: carriage.velocity.x - CARRIAGE_SPEED, y: 0 });
        moving = true;
      }
      if (keys.right && !keys.left) {
        Body.setVelocity(carriage, { x: carriage.velocity.x + CARRIAGE_SPEED, y: 0 });
        moving = true;
      }
      // También detecta movimiento por joystick
      if (window.joystickState && Math.abs(window.joystickState.x) > 0.05) {
        moving = true;
      }
      // Sonido motorcito
      if (moving) {
        startMotorSound();
      } else {
        stopMotorSound();
      }

      // Animación suave de cierre/apertura de brazos
      if (leftFinger && rightFinger) {
        Body.setAngle(leftFinger, leftFinger.angle + (leftTarget - leftFinger.angle) * FINGER_SPEED);
        Body.setAngularVelocity(leftFinger, 0);
        Body.setAngle(rightFinger, rightFinger.angle + (rightTarget - rightFinger.angle) * FINGER_SPEED);
        Body.setAngularVelocity(rightFinger, 0);
      }

      // Joystick
      if (window.joystickState) {
        if (Math.abs(window.joystickState.x) > 0.05) {
          Body.setVelocity(carriage, { x: window.joystickState.x * 7, y: 0 });
        }
        if (Math.abs(window.joystickState.y) > 0.6) { // aún menos sensible vertical
          if (window.joystickState.y < 0) removeLink();
          if (window.joystickState.y > 0) addLink();
        }
      }

      // Limitar giro de las piezas para que se muevan menos
      limitAngular(claw, 0.4);
      limitAngular(leftFinger, 0.6);
      limitAngular(rightFinger, 0.6);
    }

    function isGrabbing(body) {
      return grabConstraint && grabConstraint.bodyB === body;
    }

    function toggleArms() {
      armsClosed = !armsClosed;
      leftTarget = armsClosed ? Math.PI/4 : Math.PI/10;
      rightTarget = armsClosed ? -Math.PI/4 : -Math.PI/10;
    }

    function toggleGrab() {
      if (!canToggleGrab) return;
      canToggleGrab = false; setTimeout(() => canToggleGrab = true, 180);
      if (grabConstraint) { releaseGrab(); return; }

      let nearest = null, bestDist = Infinity;
      for (const p of plushes) {
        if (!p) continue;
        const d = Vector.magnitude(Vector.sub(p.position, claw.position));
        if (d < GRAB_RADIUS * 1.25 && d < bestDist) { bestDist = d; nearest = p; }
      }
      if (nearest) {
        grabConstraint = Constraint.create({
          bodyA: claw,
          bodyB: nearest,
          length: Math.max(6, bestDist * 0.45),
          stiffness: 1.0, // mucho más rígido
          damping: 0.2,
          render: { strokeStyle: '#fff', lineWidth: 2 }
        });
        World.add(world, grabConstraint);
      }
    }

    function releaseGrab() {
      if (!grabConstraint) return;
      World.remove(world, grabConstraint);
      grabConstraint = null;
    }

    function resetGame() {
      World.clear(world, false);
      Engine.clear(engine);
      score = 0; plushes = []; grabConstraint = null; keys = { left:false, right:false }; wheelAcc = 0;

      buildArena();
      buildClaw();
      //spawnPlushes();
      addMouse();
      addWheel();
      addHud();
    }

    function onKey(e) {
      const down = e.type === 'keydown';
      switch (e.code) {
        case 'ArrowLeft': case 'KeyA': keys.left = down; break;
        case 'ArrowRight': case 'KeyD': keys.right = down; break;
        case 'ArrowUp': case 'KeyW': if (down) removeLink(); break;
        case 'ArrowDown': case 'KeyS': if (down) addLink(); break;
        case 'Space': if (down) toggleArms(); break;
        case 'KeyR': if (down) resetGame(); break;
      }
    }

    window.addEventListener('keydown', function(e) {
  if (e.code === 'Space') {
    e.preventDefault();
  }
}, { capture: true });

    function limitAngular(body, max) {
      if (!body) return;
      const av = body.angularVelocity || 0;
      if (av >  max) Body.setAngularVelocity(body,  max);
      if (av < -max) Body.setAngularVelocity(body, -max);
    }

    // --- Utilidades
    function randomPastel() {
      const h = Math.floor(Math.random()*360);
      return `hsl(${h} 80% 75%)`;
    }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function safeRemove(b) {
      try { World.remove(world, b); } catch(_) {}
      const idx = plushes.indexOf(b); if (idx >= 0) plushes[idx] = null;
    }

  })();
  </script>
