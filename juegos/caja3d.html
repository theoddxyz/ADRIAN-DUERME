<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escena 3D Caja Vacía</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.module.js';

    // Escena
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeeeeee);

    // Cámara
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5);

    // Renderizador
    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Caja sólida (sin el frente)
    const boxSize = 2;
    const thickness = 0.1;
    const boxMaterial = new THREE.MeshPhongMaterial({ color: 0x3333ff, transparent: true, opacity: 0.7 });
    // Lados (sin el frente)
    const sides = [
      { pos: [0, 0, -boxSize/2], rot: [0, 0, 0] }, // fondo
      { pos: [-boxSize/2, 0, 0], rot: [0, Math.PI/2, 0] }, // izquierda
      { pos: [boxSize/2, 0, 0], rot: [0, Math.PI/2, 0] }, // derecha
      { pos: [0, boxSize/2, 0], rot: [Math.PI/2, 0, 0] }, // arriba
      { pos: [0, -boxSize/2, 0], rot: [Math.PI/2, 0, 0] }, // abajo
    ];
    // Cannon-es para físicas
    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
    const defaultMaterial = new CANNON.Material('default');
    const contactMaterial = new CANNON.ContactMaterial(defaultMaterial, defaultMaterial, { friction: 0.3, restitution: 0.6 });
    world.defaultContactMaterial = contactMaterial;
    sides.forEach(side => {
      const geo = new THREE.BoxGeometry(boxSize, boxSize, thickness);
      const mesh = new THREE.Mesh(geo, boxMaterial);
      mesh.position.set(...side.pos);
      mesh.rotation.set(...side.rot);
      scene.add(mesh);
      // Física: paredes estáticas
      const shape = new CANNON.Box(new CANNON.Vec3(boxSize/2, boxSize/2, thickness/2));
      const body = new CANNON.Body({ mass: 0, material: defaultMaterial });
      body.addShape(shape, new CANNON.Vec3(...side.pos), new CANNON.Quaternion().setFromEuler(...side.rot));
      world.addBody(body);
    });

    // Esferas con físicas reales
    const sphereMeshes = [];
    const sphereBodies = [];
    for (let i = 0; i < 5; i++) {
      const radius = 0.2 + Math.random() * 0.15;
      const geo = new THREE.SphereGeometry(radius, 32, 32);
      const mat = new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(
        (Math.random()-0.5)*1.2,
        0.7 + Math.random()*0.5,
        (Math.random()-0.5)*1.2
      );
      scene.add(mesh);
      sphereMeshes.push(mesh);
      // Física
      const shape = new CANNON.Sphere(radius);
      const body = new CANNON.Body({ mass: 1, material: defaultMaterial });
      body.addShape(shape);
      body.position.set(mesh.position.x, mesh.position.y, mesh.position.z);
      world.addBody(body);
      sphereBodies.push(body);
    }

    // Luz
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    // Interacción: arrastrar esferas con el mouse
    let selected = null;
    let mouse = new THREE.Vector2();
    let raycaster = new THREE.Raycaster();
    let plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    let offset = new THREE.Vector3();

    renderer.domElement.addEventListener('pointerdown', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(sphereMeshes);
      if (intersects.length > 0) {
        selected = intersects[0].object;
        plane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(plane.normal), selected.position);
        const intersect = raycaster.ray.intersectPlane(plane, new THREE.Vector3());
        offset.copy(intersect).sub(selected.position);
      }
    });
    renderer.domElement.addEventListener('pointermove', (event) => {
      if (selected) {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersect = raycaster.ray.intersectPlane(plane, new THREE.Vector3());
        if (intersect) {
          selected.position.copy(intersect.sub(offset));
          // Actualiza la física
          const idx = sphereMeshes.indexOf(selected);
          if (idx !== -1) {
            sphereBodies[idx].position.copy(selected.position);
            sphereBodies[idx].velocity.set(0,0,0);
          }
        }
      }
    });
    renderer.domElement.addEventListener('pointerup', () => {
      selected = null;
    });

    // Animación
    function animate() {
      requestAnimationFrame(animate);
      world.step(1/60);
      sphereMeshes.forEach((mesh, i) => {
        if (mesh !== selected) {
          mesh.position.copy(sphereBodies[i].position);
        }
      });
      renderer.render(scene, camera);
    }
    animate();

    // Responsive
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
